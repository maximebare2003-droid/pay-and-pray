<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay &amp; Pray</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pay &amp; Pray">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090D" media="(prefers-color-scheme: dark)">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --base:#EEF1F6; --ink:#0F1318; --muted:#5B6472; --faint:#8A93A1;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78); --glass-border:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95); --glass-shadow:0 10px 40px rgba(20,30,60,.10), 0 1px 2px rgba(20,30,60,.06);
  --line:rgba(15,19,24,.08); --track:rgba(15,19,24,.08); --field:rgba(255,255,255,.6);
  --save:#7357F6; --save-soft:rgba(115,87,246,.14);
  --bad:#E0452F; --bad-soft:rgba(224,69,47,.12); --warn:#D98A00; --warn-soft:rgba(230,150,0,.14); --ok-soft:rgba(40,170,110,.14);
  --accent:#16A06B; --accent-ink:#fff; --accent-soft:rgba(22,160,107,.14);
  --b1:#8FE3C0; --b2:#86D2EC; --b3:#D6F29B;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --base:#07090D; --ink:#F2F4F8; --muted:#A0A8B6; --faint:#6F7886;
    --glass:rgba(30,33,42,.52); --glass-strong:rgba(34,37,46,.82); --glass-border:rgba(255,255,255,.12);
    --glass-hi:rgba(255,255,255,.16); --glass-shadow:0 10px 40px rgba(0,0,0,.45);
    --line:rgba(255,255,255,.09); --track:rgba(255,255,255,.10); --field:rgba(255,255,255,.07);
    --save:#A897FF; --save-soft:rgba(168,151,255,.18); --bad:#FF7A66; --bad-soft:rgba(255,122,102,.16);
    --warn:#FFC24D; --warn-soft:rgba(255,194,77,.16); --ok-soft:rgba(80,220,150,.14);
    --accent-ink:#0B0D12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --base:#07090D; --ink:#F2F4F8; --muted:#A0A8B6; --faint:#6F7886;
  --glass:rgba(30,33,42,.52); --glass-strong:rgba(34,37,46,.82); --glass-border:rgba(255,255,255,.12);
  --glass-hi:rgba(255,255,255,.16); --glass-shadow:0 10px 40px rgba(0,0,0,.45);
  --line:rgba(255,255,255,.09); --track:rgba(255,255,255,.10); --field:rgba(255,255,255,.07);
  --save:#A897FF; --save-soft:rgba(168,151,255,.18); --bad:#FF7A66; --bad-soft:rgba(255,122,102,.16);
  --warn:#FFC24D; --warn-soft:rgba(255,194,77,.16); --ok-soft:rgba(80,220,150,.14);
  --accent-ink:#0B0D12; color-scheme:dark;
}
/* colour themes: only the background light and the accent change */
.theme-green{--accent:#16A06B;--accent-soft:rgba(22,160,107,.15);--b1:#8FE3C0;--b2:#86D2EC;--b3:#D6F29B}
.theme-blue{--accent:#2F6BEA;--accent-soft:rgba(47,107,234,.15);--b1:#9CC3FF;--b2:#B7A6FF;--b3:#8FE2FF}
.theme-pink{--accent:#D93A7E;--accent-soft:rgba(217,58,126,.14);--b1:#FFAFD0;--b2:#FFC8A3;--b3:#D8B2FF}
.theme-orange{--accent:#DD7414;--accent-soft:rgba(221,116,20,.15);--b1:#FFCB8C;--b2:#FFAE9C;--b3:#FFE594}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-green{--accent:#3DDC97;--b1:#0E5C44;--b2:#0C4A62;--b3:#3C5A12}
  :root:not([data-theme="light"]) .theme-blue{--accent:#6EA1FF;--b1:#1B3E86;--b2:#3E2C8C;--b3:#0D5670}
  :root:not([data-theme="light"]) .theme-pink{--accent:#FF77B3;--b1:#7A1846;--b2:#7A3A18;--b3:#4E2A80}
  :root:not([data-theme="light"]) .theme-orange{--accent:#FFA24D;--b1:#7A4210;--b2:#7A2A1C;--b3:#6E5A10}
}
:root[data-theme="dark"] .theme-green{--accent:#3DDC97;--b1:#0E5C44;--b2:#0C4A62;--b3:#3C5A12}
:root[data-theme="dark"] .theme-blue{--accent:#6EA1FF;--b1:#1B3E86;--b2:#3E2C8C;--b3:#0D5670}
:root[data-theme="dark"] .theme-pink{--accent:#FF77B3;--b1:#7A1846;--b2:#7A3A18;--b3:#4E2A80}
:root[data-theme="dark"] .theme-orange{--accent:#FFA24D;--b1:#7A4210;--b2:#7A2A1C;--b3:#6E5A10}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--base);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;background:transparent;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:
  radial-gradient(38% 32% at 18% 22%, var(--b1) 0%, transparent 70%),
  radial-gradient(34% 30% at 85% 30%, var(--b2) 0%, transparent 70%),
  radial-gradient(40% 34% at 55% 88%, var(--b3) 0%, transparent 72%), var(--base);
  filter:saturate(1.15);transition:background .6s ease}
@media (prefers-reduced-motion:no-preference){ .bg{animation:drift 26s ease-in-out infinite alternate} }
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.06)}}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:.95rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.85rem} .hidden{display:none!important}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi), var(--glass-shadow);border-radius:26px}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}

/* ---------- Top ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{font-family:var(--round);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.monthnav{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.monthnav button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:1.2rem;line-height:1;color:var(--ink)}
.monthnav button:hover{background:var(--line)}
.monthnav span{min-width:118px;text-align:center;font-weight:600;font-size:.95rem;text-transform:capitalize}

/* ---------- Scope switch ---------- */
.scopebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;max-width:100%;overflow-x:auto}
.seg button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:999px;padding:7px 14px 7px 7px;font-weight:600;font-size:.92rem;white-space:nowrap;color:var(--ink)}
.seg .av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px var(--accent-soft)}
.seg button[aria-pressed="true"] .av{background:rgba(255,255,255,.25);color:#fff}
.dayinfo{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dayinfo .mini{width:70px;height:5px;border-radius:4px;background:var(--track);overflow:hidden}
.dayinfo .mini i{display:block;height:100%;background:var(--ink);opacity:.5}

/* ---------- Layout ---------- */
.dash{display:grid;gap:14px}
.dash > .col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}
@media (min-width:900px){
  .dash{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start;gap:18px}
  .dash > .col{display:grid;gap:18px;min-width:0}
}
.card{padding:18px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}

/* ---------- Hero ---------- */
.hero{padding:22px 20px 18px}
.hero .lead{margin:0;color:var(--muted);font-size:.92rem;font-weight:500}
.hero .big{font-family:var(--round);font-weight:800;font-size:clamp(3rem,13vw,4.4rem);line-height:1;letter-spacing:-.035em;margin:6px 0 6px;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--bad)}
.hero .perday{margin:0;font-size:.95rem;color:var(--muted)}
.hero .perday b{color:var(--ink)}
.moneybar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--track);margin:18px 0 12px;gap:2px}
.moneybar i{display:block;height:100%}
.mb-fixed{background:var(--ink);opacity:.8}
.mb-var{background:var(--ink);opacity:.35}
.mb-spent{background:var(--ink);opacity:.6}
.mb-saved{background:var(--save)}
.mb-res{background:repeating-linear-gradient(45deg,var(--faint) 0 4px,transparent 4px 8px);opacity:.8}
.mb-free{background:var(--accent)}
.mb-over{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.legend div{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend strong{color:var(--ink);font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Quick actions ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pillbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 16px;font-weight:600;font-size:.92rem;color:var(--ink)}
.pillbtn svg{width:18px;height:18px;flex:none}
.pillbtn.accent{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px var(--accent-soft)}

/* ---------- Alerts ---------- */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alerts li{padding:10px 12px;border-radius:14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.alerts li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:currentColor}
.alerts .bad{background:var(--bad-soft)} .alerts .bad::before{color:var(--bad)}
.alerts .warn{background:var(--warn-soft)} .alerts .warn::before{color:var(--warn)}
.allgood{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600;font-size:.92rem}
.allgood .check{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem}

/* ---------- Bars ---------- */
.group + .group{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.gtot{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cat{padding:7px 0}
.catrow{display:flex;justify-content:space-between;gap:8px;font-size:.93rem;margin-bottom:6px}
.catrow .amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.catrow .amt .muted{font-weight:400}
.bar{position:relative;height:7px;background:var(--track);border-radius:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.bar i.save{background:var(--save)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.neutral{background:var(--ink);opacity:.55}
.bar .today{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px;opacity:.45}
.tick{display:inline-block;width:2px;height:11px;background:var(--ink);opacity:.45;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* ---------- Forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:16px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=month],input[type=search],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--field);min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eur{position:relative}
.eur input{padding-right:26px;text-align:right}
.eur::after{content:"€";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 13px;font-size:.9rem;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.chipgroup{font-size:.78rem;color:var(--muted);margin:12px 0 6px;font-weight:600}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:8px 0;font-size:.9rem}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.quick button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:.88rem}
.sim-out{padding:12px 14px;border-radius:14px;font-size:.95rem}
.sim-out:empty{display:none}

/* ---------- History ---------- */
.review{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:12px 14px;border-radius:18px;background:var(--field);border:1px solid var(--line)}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--round);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .d{font-size:.78rem;font-weight:600}
.up{color:var(--bad)} .down{color:var(--accent)} .flat{color:var(--muted)}
.up.good{color:var(--accent)} .down.bad2{color:var(--bad)}
.txday{font-size:.78rem;font-weight:700;color:var(--muted);margin:14px 0 2px;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:6px;padding:3px 0;border-top:1px solid var(--line)}
.txday + .tx{border-top:0}
.tx .txmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:8px;margin:0 -8px;border-radius:14px;text-align:left;color:var(--ink)}
button.txmain:hover{background:var(--field)}
.tx .dot{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.tx .info{flex:1;min-width:0}
.tx .info div:first-child{font-weight:600}
.tx .info div:last-child{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .val{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tx .del{flex:none;border:0;background:transparent;color:var(--faint);font-size:1.2rem;min-width:32px;height:32px;border-radius:10px}
.tx .del:hover{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:2px;margin-left:4px}
.tag.save{background:var(--save-soft);color:var(--save)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;margin:6px 0 10px;position:relative}
.months .revline{position:absolute;left:0;right:0;border-top:2px dashed var(--faint);opacity:.6;pointer-events:none}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;border:0;background:transparent;padding:0;min-width:0;color:var(--ink)}
.mcol .plot{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.mcol .stack{width:100%;max-width:40px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:var(--track)}
.mcol .stack b{display:block}
.mcol small{font-size:.74rem;line-height:18px;color:var(--muted);text-transform:capitalize}
.mcol .v{font-size:.7rem;line-height:16px;min-height:16px;color:var(--muted);white-space:nowrap}
.mcol.sel small{color:var(--ink);font-weight:700}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.key span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.key .dash-key::before{width:14px;height:0;border-top:2px dashed var(--faint);border-radius:0;background:none;vertical-align:3px}
.totrow{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}

/* ---------- Goals ---------- */
.goal{padding:18px;display:grid;gap:10px}
.goalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goalname{font-weight:700;font-size:1.05rem}
.goalpct{font-family:var(--round);font-weight:800;font-size:1.6rem;color:var(--accent)}
.gbar{height:12px;border-radius:8px;background:var(--track);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.goalfoot{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.goalfoot b{color:var(--ink);font-family:var(--round)}
.editbtn{border:0;background:var(--field);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:.82rem;font-weight:600}

/* ---------- Settings ---------- */
.setrow{display:grid;grid-template-columns:1fr 112px auto;gap:8px;align-items:center;margin-bottom:8px}
.setrow button,.mdel{min-width:34px;height:34px;border:0;background:transparent;color:var(--faint);font-size:1.2rem;border-radius:10px}
.setrow button:hover,.mdel:hover{background:var(--bad-soft);color:var(--bad)}
.armed{width:auto!important;padding:0 10px!important;background:var(--bad)!important;color:#fff!important;font-size:.82rem!important;font-weight:700;white-space:nowrap}
.member{padding:14px 0;border-top:1px solid var(--line)}
.member:first-of-type{border-top:0;padding-top:0}
.memhead{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.memhead input{font-weight:600}
.mem2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches{display:flex;gap:6px;align-items:center}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--accent);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--base)}
.subhead{font-size:.8rem;font-weight:700;color:var(--muted);margin:14px 0 8px}
.plan{display:grid;gap:6px;font-size:.93rem}
.plan div{display:flex;justify-content:space-between;gap:8px}
.plan .tot{font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.planbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--track);margin:0 0 14px;gap:2px}
.planbar i{display:block;height:100%}

/* ---------- Tab bar (floating glass) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;pointer-events:auto}
.tabs{flex:1;display:flex;justify-content:space-around;padding:6px;border-radius:999px}

}

  display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;max-width:92vw;white-space:nowrap}

<script>
/* ---------- helpers ---------- */
const eur0 = new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur2 = new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const E = n => eur0.format(Math.round(n||0));
const E2 = n => eur2.format(n||0);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const curMonth = () => todayStr().slice(0,7);
const addMonths = (m,k) => { let [y,mo]=m.split('-').map(Number); mo+=k; while(mo>12){mo-=12;y++} while(mo<1){mo+=12;y--} return y+'-'+pad(mo); };
const monthLabel = (m,short) => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-GB', short?{month:'short'}:{month:'long',year:'numeric'}); };
const daysIn = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
const parseAmt = s => { const v = parseFloat(String(s).replace(/\s/g,'').replace(',','.')); return isFinite(v) ? Math.round(v*100)/100 : NaN; };
const $ = id => document.getElementById(id);
function armDelete(b, label){
  if(b.dataset.armed==='1') return true;
  document.querySelectorAll('[data-armed="1"]').forEach(x=>disarm(x));
  b.dataset.armed='1'; b.dataset.old=b.textContent; b.textContent=label||'Delete?'; b.classList.add('armed');
  clearTimeout(b._t); b._t=setTimeout(()=>disarm(b),4000);
  return false;
}
function disarm(b){ b.dataset.armed=''; b.textContent=b.dataset.old||'×'; b.classList.remove('armed'); }

const GROUPS = [
  {id:'fixe', name:'Fixed costs', hint:'Rent, bills, everything that comes back every month'},
  {id:'epargne', name:'Shared savings', hint:'Fixed amount put aside every month from the shared account, added together with fixed costs'},
  {id:'variable', name:'Variable spending', hint:'Where money goes the fastest'}
];
const DEFAULT_SETTINGS = {
  members:[
    {id:'m1',name:'Person 1',salary:0,contribution:0,epGoal:0},
    {id:'m2',name:'Person 2',salary:0,contribution:0,epGoal:0}
  ],
  categories:[
    {id:'loyer',name:'Rent',group:'fixe',budget:0},
    {id:'energie',name:'Energy and water',group:'fixe',budget:0},
    {id:'assur',name:'Insurance',group:'fixe',budget:0},
    {id:'tel',name:'Phone and internet',group:'fixe',budget:0},
    {id:'abos',name:'Subscriptions',group:'fixe',budget:0},
    {id:'voitfixe',name:'Car (loan, tax)',group:'fixe',budget:0},
    {id:'epsecu',name:'Emergency fund',group:'epargne',budget:0},
    {id:'epvoy',name:'Travel savings',group:'epargne',budget:0},
    {id:'courses',name:'Groceries',group:'variable',budget:0},
    {id:'essence',name:'Fuel and maintenance',group:'variable',budget:0},
    {id:'sorties',name:'Going out and restaurants',group:'variable',budget:0},
    {id:'shopping',name:'Clothes and shopping',group:'variable',budget:0},
    {id:'maison',name:'Home',group:'variable',budget:0},
    {id:'sante',name:'Health',group:'variable',budget:0},
    {id:'cadeaux',name:'Gifts',group:'variable',budget:0},
    {id:'divers',name:'Other',group:'variable',budget:0}
  ]
};

/* ---------- state ---------- */
let settings = null;
let settingsExists = false;
let txs = [];
let month = curMonth();
let view = 'mois';
let scope = 'commun';          // 'commun' | member id | 'tout' (historique only)
let uid = null;
let names = {};
let canWrite = true;
let backend = null;
let draftSettings = null;
let selectedCat = null;
let selectedScope = 'commun';
let editTx = null;
let plans = {};                // 'YYYY-MM' -> snapshot of settings in force from that month
let plansLoaded = false;
let downloadsApi = null;

const scopeOf = t => t.scope || 'commun';
const THEMES = ['blue','pink','orange'];
function themeOf(sc){
  if(sc==='commun' || sc==='tout' || !settings) return 'green';
  const i = settings.members.findIndex(x=>x.id===sc);
  const m = settings.members[i];
  if(!m) return 'green';
  if(m.color && (m.color==='green' || THEMES.includes(m.color))) return m.color;
  if(/wik/i.test(m.name)) return 'pink';
  if(/max/i.test(m.name)) return 'blue';
  return THEMES[i % THEMES.length];
}
const themeCls = sc => 'theme-' + themeOf(sc);
function scopeLabel(sc){
  if(sc==='commun') return 'Shared';
  if(sc==='tout') return 'All';
  const m = settings && settings.members.find(x=>x.id===sc);
  return m ? (m.name||'Personal') : 'Personal';
}

/* ---------- CONFIG: paste your Supabase project values here ---------- */
const SUPABASE_URL = 'https://cjlarraxpwrnuvpevuhj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SQdv0isXEfLaOM-xhhom0Q_Al75TIk8';
const DEMO_MODE = false;

/* ---------- backends ---------- */
function supaBackend(sb){
  let sCb=null, pCb=null, tCb=null, range=null;
  async function loadSettings(){
    const {data, error} = await sb.from('settings').select('data').eq('id',1).maybeSingle();
    if(error){ onDbError(error); return; }
    sCb && sCb(data ? data.data : null, !!data);
  }
  async function loadPlans(){
    const {data, error} = await sb.from('plans').select('month,data');
    if(error){ onDbError(error); return; }
    const o={}; (data||[]).forEach(r=>o[r.month]=r.data); pCb && pCb(o);
  }
  async function loadTx(){
    if(!range) return;
    const {data, error} = await sb.from('tx').select('id,data').gte('month',range[0]).lte('month',range[1]).limit(5000);
    if(error){ onDbError(error); return; }
    tCb && tCb((data||[]).map(r=>({...r.data, id:r.id})));
  }
  // live updates between phones
  sb.channel('budget-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>loadSettings())
    .on('postgres_changes',{event:'*',schema:'public',table:'plans'},()=>loadPlans())
    .on('postgres_changes',{event:'*',schema:'public',table:'tx'},()=>loadTx())
    .subscribe();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ loadSettings(); loadPlans(); loadTx(); } });
  const chk = r => { if(r.error) throw r.error; return r; };
  return {
    kind:'supabase',
    subSettings(cb){ sCb=cb; loadSettings(); return ()=>{sCb=null}; },
    subPlans(cb){ pCb=cb; loadPlans(); return ()=>{pCb=null}; },
    subTx(from,to,cb){ tCb=cb; range=[from,to]; loadTx(); return ()=>{tCb=null}; },
    async saveSettings(st){ chk(await sb.from('settings').upsert({id:1, data:st})); loadSettings(); },
    async savePlan(m,pl){ chk(await sb.from('plans').upsert({month:m, data:pl})); loadPlans(); },
    async addTx(t){ const {id, ...rest}=t; const r = chk(await sb.from('tx').insert({month:rest.month, data:rest}).select('id').single()); loadTx(); return r.data && r.data.id; },
    async updTx(id,t){ const {id:_, ...rest}=t; chk(await sb.from('tx').update({month:rest.month, data:rest}).eq('id',id)); loadTx(); },
    async delTx(id){ chk(await sb.from('tx').delete().eq('id',id)); loadTx(); },
    async allTx(){
      const out=[]; let from=0;
      while(true){
        const r = chk(await sb.from('tx').select('id,data').order('month').range(from, from+999));
        (r.data||[]).forEach(x=>out.push({...x.data, id:x.id}));
        if(!r.data || r.data.length<1000) break; from+=1000;
      }
      return out;
    },
    async importAll(b){
      if(b.settings) chk(await sb.from('settings').upsert({id:1, data:b.settings}));
      for(const [m,pl] of Object.entries(b.plans||{})) chk(await sb.from('plans').upsert({month:m, data:pl}));
      const rows = (b.txs||[]).map(t=>{ const {id, ...rest}=t; return {month:rest.month, data:rest}; });
      for(let i=0;i<rows.length;i+=500) chk(await sb.from('tx').insert(rows.slice(i,i+500)));
      loadSettings(); loadPlans(); loadTx();
    },
    async signOut(){ await sb.auth.signOut(); location.reload(); }
  };
}
function localBackend(){
  const KEY='budget-menage-v1';
  let store = {settings:null, txs:[], plans:{}};
  try { const raw = localStorage.getItem(KEY); if(raw) store = JSON.parse(raw); } catch(e){}
  store.plans = store.plans || {};
  const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} };
  let sCb=null, tCb=null, range=null;
  const emitT = () => tCb && tCb(store.txs.filter(t=>t.month>=range[0] && t.month<=range[1]));
  return {
    kind:'local',
    subSettings(cb){ sCb=cb; cb(store.settings, !!store.settings); return ()=>{sCb=null}; },
    subTx(from,to,cb){ tCb=cb; range=[from,to]; emitT(); return ()=>{tCb=null}; },
    async saveSettings(s){ store.settings=s; persist(); sCb && sCb(s,true); },
    async addTx(t){ t={...t, id:rid()}; store.txs.push(t); persist(); emitT(); return t.id; },
    async delTx(id){ store.txs=store.txs.filter(t=>t.id!==id); persist(); emitT(); },
    async updTx(id,t){ store.txs=store.txs.map(x=>x.id===id?{...t,id}:x); persist(); emitT(); },
    subPlans(cb){ cb({...store.plans}); this._pcb=cb; return ()=>{}; },
    async savePlan(m,pl){ store.plans[m]=pl; persist(); this._pcb && this._pcb({...store.plans}); },
    async allTx(){ return store.txs.slice(); },
    async importAll(b){ if(b.settings) store.settings=b.settings; store.plans={...store.plans, ...(b.plans||{})}; (b.txs||[]).forEach(t=>{ const {id,...r}=t; store.txs.push({...r, id:rid()}); }); persist(); sCb&&sCb(store.settings,true); this._pcb&&this._pcb({...store.plans}); emitT(); }
  };
}
function dbBackend(db){
  const sref = db.doc('budget/settings');
  return {
    kind:'db',
    subSettings(cb){ return sref.onSnapshot(s=>cb(s.exists?s.data():null, s.exists), e=>onDbError(e)); },
    subTx(from,to,cb){
      return db.collection('tx').where('month','>=',from).where('month','<=',to)
        .onSnapshot(q=>cb(q.docs.map(d=>({...d.data(), id:d.id}))), e=>onDbError(e));
    },
    async saveSettings(s){ await sref.set(s); },
    async addTx(t){ await db.collection('tx').add(t); },
    async delTx(id){ await db.doc('tx/'+id).delete(); },
    async updTx(id,t){ await db.doc('tx/'+id).set(t); },
    subPlans(cb){ return db.collection('plans').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>o[d.id]=d.data()); cb(o); }, e=>onDbError(e)); },
    async savePlan(m,pl){ await db.doc('plans/'+m).set(pl); },
    async allTx(){
      const out=[]; const cm=curMonth(); const y1=+cm.slice(0,4);
      for(let y=2024; y<=y1+1; y++){
        const q = await db.collection('tx').where('month','>=',y+'-01').where('month','<=',y+'-12').limit(1000).get();
        q.docs.forEach(d=>out.push({...d.data(), id:d.id}));
      }
      return out;
    }
  };
}
function onDbError(e){
  if(e && e.code==='revoked'){ canWrite=false; render(); return; }
  toast('Connection problem. Please reload the page.');
}
function handleWriteError(e){
  if(e && e.code==='invalid_argument'){ canWrite=false; toast('You have read-only access.'); render(); return; }
  if(e && e.code==='quota_exceeded'){ toast('Storage full: delete some old expenses.'); return; }
  toast('Could not save, please try again.');
}

let unsubTx = null;
function subscribeMonth(){
  if(unsubTx) unsubTx();
  unsubTx = backend.subTx(addMonths(month,-5), month, list => { txs = list; allTxCache = null; resolveNames(); render(); });
}
async function resolveNames(){
  txs.forEach(t=>{ if(t.by && !(t.by in names)) names[t.by] = String(t.by).includes('@') ? String(t.by).split('@')[0] : ''; });
  if(!window._user) return;
  const ids = [...new Set(txs.map(t=>t.by).filter(Boolean))].filter(id=>!(id in names));
  if(!ids.length) return;
  try{
    const ps = await window._user.profiles(ids);
    ids.forEach(id=>{ names[id] = (ps[id] && ps[id].name) || ''; });
    render();
  }catch(e){}
}

async function init(){
  renderMonthNav();
  try{ const s=localStorage.getItem('pp-scope'); if(s) scope=s; }catch(e){}
  if(DEMO_MODE){
    backend = localBackend(); uid='demo';
    backend.subSettings((s,exists)=>{ settingsExists=exists; settings = s ? normalize(s) : JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); if(scope!=='commun' && !settings.members.some(m=>m.id===scope)) scope='commun'; render(); });
    subscribeMonth();
    backend.subPlans(o=>{ plans={}; Object.keys(o).forEach(k=>{ plans[k]=normalize(o[k]); }); plansLoaded=true; render(); });
    return;
  }
  if(!window.supabase || SUPABASE_URL.startsWith('PASTE')){
    const n=$('modeNote'); n.textContent = !window.supabase ? 'Could not load the app library. Check your internet connection and reload.' : 'Setup not finished: paste your Supabase URL and key at the top of the script (see the guide).'; n.classList.remove('hidden');
    $('view').innerHTML=''; return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let { data:{ session } } = await sb.auth.getSession();
  if(!session){
    $('login').classList.remove('hidden');
    const go = async()=>{
      $('lGo').disabled=true; $('loginMsg').textContent='Signing in…';
      const { data, error } = await sb.auth.signInWithPassword({ email:$('lEmail').value.trim(), password:$('lPass').value });
      $('lGo').disabled=false;
      if(error){ $('loginMsg').textContent='Wrong email or password.'; return; }
      location.reload();
    };
    $('lGo').onclick=go; $('lPass').onkeydown=e=>{ if(e.key==='Enter') go(); };
    return;
  }
  uid = session.user.email;
  backend = supaBackend(sb);
  backend.subSettings((s,exists)=>{
    settingsExists = exists;
    settings = s ? normalize(s) : JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    maybeSeedPlan();
    if(scope!=='commun' && !settings.members.some(m=>m.id===scope)) scope='commun';
    if(!exists && view==='mois') view='reglages';
    if(view!=='reglages') draftSettings=null;
    render();
  });
  subscribeMonth();
  backend.subPlans(o=>{
    plans = {}; Object.keys(o).forEach(k=>{ plans[k]=normalize(o[k]); });
    plansLoaded = true; maybeSeedPlan(); render();
  });
}
async function maybeSeedPlan(){
  // First time: remember the current settings as the plan in force since this month
  if(!plansLoaded || !settingsExists || !canWrite || Object.keys(plans).length || maybeSeedPlan._done) return;
  maybeSeedPlan._done = true;
  try{ await backend.savePlan(curMonth(), JSON.parse(JSON.stringify(settings))); }catch(e){}
}
function planFor(m){
  if(!settings) return null;
  if(m >= curMonth()) return settings;
  const keys = Object.keys(plans).sort();
  if(!keys.length) return settings;
  let k = null; keys.forEach(x=>{ if(x<=m) k=x; });
  return plans[k || keys[0]];
}
function catById(id){
  let c = settings.categories.find(x=>x.id===id);
  if(c) return c;
  for(const k of Object.keys(plans)){ c = plans[k].categories.find(x=>x.id===id); if(c) return c; }
  return null;
}
function normalize(s){
  let members;
  if(Array.isArray(s.members)) members = s.members;
  else if(Array.isArray(s.incomes)) members = s.incomes.map(i=>({id:i.id,name:i.name,salary:i.amount,contribution:i.amount,epGoal:0}));
  else members = [];
  return {
    members: members.map(m=>({id:String(m.id||rid()),name:String(m.name||''),salary:Number(m.salary)||0,contribution:Number(m.contribution)||0,epGoal:Number(m.epGoal)||0,color:m.color?String(m.color):'',fixed:Array.isArray(m.fixed)?m.fixed.filter(f=>f&&f.cat).map(f=>({cat:String(f.cat),amount:Number(f.amount)||0})):[]})),
    categories: Array.isArray(s.categories)? s.categories.map(c=>({id:String(c.id||rid()),name:String(c.name||''),group:['fixe','variable','epargne'].includes(c.group)?c.group:'variable',budget:Number(c.budget)||0,archived:!!c.archived})) : [],
    goals: Array.isArray(s.goals) ? s.goals.map(g=>({id:String(g.id||rid()),name:String(g.name||''),target:Number(g.target)||0,start:Number(g.start)||0,cat:String(g.cat||''),scope:String(g.scope||'any'),deadline:String(g.deadline||'')})) : []
  };
}

/* ---------- calculations ---------- */
function calc(m, sc){
  const P = planFor(m);
  const cats = P.categories, members = P.members;
  const isCommun = sc==='commun';
  const list = txs.filter(t=>t.month===m && (sc==='tout' || scopeOf(t)===sc));
  const spent = {}; cats.forEach(c=>spent[c.id]=0);
  let unknown = 0;
  list.forEach(t=>{ const a=Number(t.amount)||0; if(t.cat in spent) spent[t.cat]+=a; else unknown+=a; });
  const g = {fixe:{b:0,s:0,left:0}, variable:{b:0,s:0,left:0}, epargne:{b:0,s:0,left:0}};
  cats.forEach(c=>{ const x=g[c.group]; const b=isCommun?c.budget:0; x.b+=b; x.s+=spent[c.id]; x.left+=Math.max(b-spent[c.id],0); });
  g.variable.s += unknown;
  let revenus=0, epGoal=0, member=null;
  if(isCommun) revenus = members.reduce((a,x)=>a+x.contribution,0);
  else if(sc==='tout') revenus = members.reduce((a,x)=>a+x.salary,0);
  else { member = members.find(x=>x.id===sc) || settings.members.find(x=>x.id===sc); if(member){ revenus = member.salary-member.contribution; } }
  const persoFixedLeft = (!isCommun && member && member.fixed) ? member.fixed.reduce((a,f)=>a+Math.max((f.amount||0)-(list.filter(t=>t.cat===f.cat).reduce((x,t)=>x+(Number(t.amount)||0),0)),0),0) : 0;
  const fixeReserved = isCommun ? g.fixe.left : persoFixedLeft;
  const epReserved = isCommun ? g.epargne.left : Math.max(epGoal - g.epargne.s, 0);
  const total = g.fixe.s + g.variable.s + g.epargne.s;
  const reste = revenus - total - fixeReserved - epReserved;
  const plan = isCommun ? g.fixe.b + g.variable.b + g.epargne.b : epGoal;
  return {list, spent, revenus, g, reste, plan, fixeReserved, epReserved, epGoal, member, libreParMois: revenus - plan};
}
function progress(m){
  const cm = curMonth();
  if(m < cm) return 1;
  if(m > cm) return 0;
  return new Date().getDate() / daysIn(m);
}
function prevMonthsWithData(m, sc){
  return [1,2,3].map(k=>addMonths(m,-k)).filter(pm=>txs.some(t=>t.month===pm && scopeOf(t)===sc));
}
function catAvg(pms, sc, catId){
  if(!pms.length) return 0;
  return pms.reduce((a,pm)=>a+txs.filter(t=>t.month===pm && scopeOf(t)===sc && t.cat===catId).reduce((x,t)=>x+(Number(t.amount)||0),0),0)/pms.length;
}

function alertsFor(m, c, sc){
  const out = [];
  const p = progress(m);
  const isCommun = sc==='commun';
  const prev = prevMonthsWithData(m, sc);
  if(isCommun){
    if(c.plan > c.revenus && c.plan>0) out.push(['bad',`The shared plan is ${E(c.plan-c.revenus)} per month more than what you pay in. Raise your contributions or lower a budget.`]);
  } else if(c.member && (c.member.fixed||[]).reduce((a,f)=>a+f.amount,0) > c.revenus && c.revenus>0){
    out.push(['bad',`Your fixed costs are bigger than your personal money. Check the settings.`]);
  } else if(c.member && c.member.contribution > c.member.salary){
    out.push(['bad',`The shared contribution is bigger than the salary. Check the settings.`]);
  }
  if(c.reste < 0) out.push(['bad', isCommun
    ? `This month, the shared account spent ${E(-c.reste)} more than it can afford.`
    : `This month, personal spending is ${E(-c.reste)} over what is left after the shared contribution.`]);
  const PC = planFor(m).categories;
  PC.forEach(cat=>{
    const s = c.spent[cat.id] || 0;
    if(isCommun && cat.group==='variable'){
      if(cat.budget>0 && s>cat.budget) out.push(['bad',`${cat.name}: ${E(s-cat.budget)} over budget.`]);
      else if(cat.budget===0 && s>0) out.push(['warn',`${cat.name}: ${E(s)} spent with no budget set.`]);
      else if(cat.budget>0 && p<1 && s/cat.budget >= .5 && s/cat.budget > p+.25)
        out.push(['warn',`${cat.name}: ${Math.round(s/cat.budget*100)}% of the budget used, but we are only ${Math.round(p*100)}% into the month.`]);
    }
    if(isCommun && cat.group==='fixe' && cat.budget>0 && s > cat.budget*1.05) out.push(['warn',`${cat.name}: ${E(s)} paid for ${E(cat.budget)} planned. Update the amount if it went up.`]);
    if(cat.group!=='epargne' && prev.length){
      const avg = catAvg(prev, sc, cat.id);
      if(avg>0 && s > avg*1.3 && s-avg >= 30) out.push(['warn',`${cat.name}: ${E(s)} this month versus ${E(avg)} on average before.`]);
    }
  });
  if(p>=1){
    if(isCommun){
      PC.filter(x=>x.group==='epargne' && x.budget>0 && c.spent[x.id] < x.budget)
        .forEach(x=>out.push(['warn',`${x.name}: only ${E(c.spent[x.id])} put aside out of ${E(x.budget)} planned.`]));
    }
  }
  const seen = new Set(); const res=[];
  out.forEach(a=>{ const k=a[1].split(': ')[0]; if(a[1].includes(': ') && seen.has(k)) return; seen.add(k); res.push(a); });
  return res;
}

/* ---------- toast with optional undo ---------- */
function toast(msg, actionLabel, actionFn){
  const t=$('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel?`<button type="button" id="toastAct">${esc(actionLabel)}</button>`:''}`;
  if(actionLabel) $('toastAct').onclick = ()=>{ t.classList.remove('show'); actionFn(); };
  t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), actionLabel?5000:2600);
}

function barHtml(spent, budget, showToday, p, base){

/* ---------- fixed amounts not logged yet ---------- */
function missingFixedFor(m, sc, c){
  const P = planFor(m);
  if(sc==='commun') return P.categories.filter(x=>(x.group==='fixe'||x.group==='epargne') && x.budget>0 && !c.spent[x.id])
    .map(x=>({cat:x.id, amount:x.budget, name:x.name, group:x.group}));
  const mem = P.members.find(x=>x.id===sc) || memberOf(sc);
  if(!mem) return [];
  const spentIn = id => txs.filter(t=>t.month===m && scopeOf(t)===sc && t.cat===id).reduce((a,t)=>a+(Number(t.amount)||0),0);
  return (mem.fixed||[]).filter(f=>f.amount>0 && !spentIn(f.cat)).map(f=>{ const cc=catById(f.cat); return {cat:f.cat, amount:f.amount, name:cc?cc.name:'Fixed cost', group:cc?cc.group:'fixe'}; });
}
async function addFixed(list, sc){
  const date = month===curMonth() ? todayStr() : month+'-01';
  try{
    for(const x of list){
      await backend.addTx({amount:x.amount, cat:x.cat, scope:sc, date, month:date.slice(0,7), note:x.group==='epargne'?'Fixed savings':'Fixed cost', by:uid||null, createdAt:Date.now()});
    }
    toast('Fixed amounts added');
  }catch(e){ handleWriteError(e); }
}

  const segs = isCommun
    ? [['mb-spent',c.g.fixe.s+c.g.variable.s,'Spent'],['mb-saved',ep,'Saved'],['mb-res',res,'Set aside'],['mb-free',libre,'Free']]
    : [['mb-fixed',c.g.fixe.s,'Fixed'],['mb-var',c.g.variable.s,'Variable'],['mb-saved',ep,'Saved'],['mb-res',res,'Set aside'],['mb-free',libre,'Free']];

    <p class="perday">${isCur && c.reste>0 && daysLeft>=3 ? `about <b>${E(c.reste/daysLeft)} a day</b> until the end of the month`
      : c.reste<0 ? 'more than this month allows' : isCommun ? 'after rent, bills and planned savings' : 'what is left can go to savings'}</p>
    <div class="moneybar" role="img" aria-label="How this month's money is split">${segs.filter(s=>s[1]>0).map(s=>`<i class="${s[0]}" style="width:${s[1]/tot*100}%"></i>`).join('')}${over>0?`<i class="mb-over" style="width:${over/tot*100}%"></i>`:''}</div>
    <div class="legend">${segs.filter(s=>s[0]!=='mb-res'||s[1]>0).map(s=>`<div><span class="dot ${s[0]}"></span>${s[2]} <strong>${E(s[1])}</strong></div>`).join('')}</div>
    <p class="small muted" style="margin:12px 0 0">Out of <b style="color:var(--ink)">${E(c.revenus)}</b> ${isCommun?'paid into the shared account':'of personal money'}</p>
  </section>`;
  h += `<div class="actions o2">
    ${missing.length?`<button class="pillbtn accent" id="addFixed">${IC.pin}Add fixed amounts · ${E(missing.reduce((a,x)=>a+x.amount,0))}</button>`:''}
    <button class="pillbtn glass" id="affordBtn">${IC.scale}Can ${isCommun?'we':'I'} afford it?</button>
  </div>`;
  h += `</div><div class="col">`;
  h += alerts.length
    ? `<section class="glass card o3"><div class="cardhead"><h2>Watch out</h2><span class="small muted">${alerts.length}</span></div><ul class="alerts">${alerts.map(a=>`<li class="${a[0]}">${esc(a[1])}</li>`).join('')}</ul></section>`
    : `<div class="glass allgood o3" style="border-radius:999px"><span class="check">✓</span>All good this month</div>`;

  const PM = planFor(month);
  h += `<section class="glass card o4"><div class="cardhead"><h2>Where the money goes</h2>${isCommun&&isCur?`<span class="small muted"><span class="tick"></span>today</span>`:''}</div>`;
  if(isCommun){
    let any=false;
    GROUPS.forEach(G=>{
      const cats = PM.categories.filter(x=>x.group===G.id && (x.budget>0 || c.spent[x.id]>0));
      if(!cats.length) return; any=true;
      const gg = c.g[G.id];
      h += `<div class="group"><div class="grouphead"><h3>${G.name}</h3><span class="gtot">${E(gg.s)} / ${E(gg.b)}</span></div>`;
      cats.forEach(cat=>{
        const s=c.spent[cat.id];
        h += `<div class="cat"><div class="catrow"><span>${esc(cat.name)}</span><span class="amt">${E(s)} <span class="muted">/ ${E(cat.budget)}</span></span></div>
          ${barHtml(s, cat.budget, isCur && G.id==='variable', p, G.id==='epargne'?'save':'')}</div>`;
      });
      h += `</div>`;
    });
    if(!any) h += `<p class="empty">Add budgets in Settings to see the breakdown.</p>`;
  } else {
    const rows = PM.categories.filter(x=>c.spent[x.id]>0);
    if(!rows.length) h += `<p class="empty">No personal expenses logged this month.</p>`;
    else {
      const max = Math.max(...rows.map(x=>c.spent[x.id]));
      const prev = prevMonthsWithData(month, sc);
      [['fixe','Fixed costs'],['variable','Variable spending'],['epargne','Personal savings']].forEach(([gid,gname])=>{
        const gr = rows.filter(x=>x.group===gid).sort((a,b)=>c.spent[b.id]-c.spent[a.id]);
        if(!gr.length) return;
        h += `<div class="group"><div class="grouphead"><h3>${gname}</h3><span class="gtot">${E(gr.reduce((a,x)=>a+c.spent[x.id],0))}</span></div>`;
        gr.forEach(cat=>{
          const s=c.spent[cat.id]; const avg = catAvg(prev, sc, cat.id);
          h += `<div class="cat"><div class="catrow"><span>${esc(cat.name)}</span><span class="amt">${E(s)}${avg>0?` <span class="muted">avg ${E(avg)}</span>`:''}</span></div>
            <div class="bar"><i class="${gid==='epargne'?'save':gid==='fixe'?'neutral':''}" style="width:${s/max*100}%"></i></div></div>`;
        });
        h += `</div>`;
      });
    }
  }
  h += `</section></div></div>`;
  $('view').innerHTML = h;
  bindSeg();
  const af=$('addFixed'); if(af) af.onclick=()=>addFixed(missing, sc);
  $('affordBtn').onclick=()=>openAfford(c, sc);
}

/* ---------- Can I afford it? sheet ---------- */
function openAfford(c, sc){
  const isCommun = sc==='commun';
  let defSave;
  if(isCommun) defSave = Math.max(0, Math.round(c.libreParMois));
  else {
    const prev = prevMonthsWithData(month, sc);
    const fixedPlan = ((c.member&&c.member.fixed)||[]).reduce((a,f)=>a+f.amount,0);
    const avgDep = prev.length ? prev.reduce((a,pm)=>{ const k=calc(pm,sc); return a+k.g.fixe.s+k.g.variable.s; },0)/prev.length : Math.max(fixedPlan, c.g.fixe.s+c.g.variable.s);
    defSave = Math.max(0, Math.round(c.revenus - avgDep));
  }
  $('affBody').innerHTML = `<p class="small muted" style="margin:0 0 14px">${isCommun?'Something for the home, a weekend, a trip':'A personal purchase, a night out, a gift'}: test it before deciding. Free right now: <b style="color:var(--ink)">${E(c.reste)}</b></p>
    <div class="row2">
      <div class="field"><label for="simAmt">Price</label><div class="eur"><input id="simAmt" type="text" inputmode="decimal" placeholder="450"></div></div>
      <div class="field"><label for="simSave">Saved per month</label><div class="eur"><input id="simSave" type="text" inputmode="decimal" value="${defSave}"></div></div>
    </div>
    <div class="quick">${[50,150,500,1500].map(v=>`<button type="button" data-q="${v}">${E(v)}</button>`).join('')}</div>
    <div class="sim-out" id="simOut" aria-live="polite"></div>`;
  $('affTitle').textContent = isCommun ? 'Can we afford it?' : 'Can I afford it?';
  const run=()=>simulate(c);
  $('simAmt').oninput=run; $('simSave').oninput=run;
  document.querySelectorAll('#affBody [data-q]').forEach(b=>b.onclick=()=>{ $('simAmt').value=b.dataset.q; run(); });
  $('affBg').className = 'sheet-bg open ' + themeCls(sc);
  $('simAmt').focus();
}
function simulate(c){
  const out=$('simOut');
  const amt=parseAmt($('simAmt').value);
  if(!(amt>0)){ out.innerHTML=''; out.style.background=''; return; }
  const save=parseAmt($('simSave').value);
  const cushion=Math.max(c.revenus*0.05, 30);
  let msg,bg;
  if(amt <= c.reste - cushion){ msg=`<b>Yes, it fits this month.</b> ${E(c.reste-amt)} will be left until the end of the month.`; bg='var(--ok-soft)'; }
  else if(amt <= c.reste){ msg=`<b>Possible, but tight.</b> Only ${E(c.reste-amt)} would be left for the rest of the month.`; bg='var(--warn-soft)'; }
  else {
    msg=`<b>Not this month</b> without touching savings.`;
    if(save>0){ const n=Math.ceil(amt/save); msg+=` By saving ${E(save)} per month, it is doable in <b>${n} month${n>1?'s':''}</b>.`; }
    else msg+=` Nothing is left free each month: cut an expense to make some room.`;
    bg='var(--bad-soft)';
  }
  out.innerHTML=msg; out.style.background=bg;
}

/* ---------- HISTORY ---------- */
let histFilter = '';
function deltaHtml(cur, prev, higherIsGood){
  if(!(prev>0)) return `<div class="d flat">no data before</div>`;
  const pct = Math.round((cur-prev)/prev*100);
  if(Math.abs(pct)<3) return `<div class="d flat">same as last month</div>`;
  const up = pct>0; const good = higherIsGood ? up : !up;
  return `<div class="d" style="color:${good?'var(--accent)':'var(--bad)'}">${up?'▲':'▼'} ${Math.abs(pct)}% vs last month</div>`;
}
function renderHisto(){
  const sc = scope;
  const c = calc(month, sc), pc = calc(addMonths(month,-1), sc);
  const catName = id => (catById(id)||{name:'Deleted category'}).name;
  const spent = c.g.fixe.s+c.g.variable.s, pspent = pc.g.fixe.s+pc.g.variable.s;
  const saved = c.g.epargne.s, psaved = pc.g.epargne.s;
  const rate = c.revenus>0 ? Math.round(saved/c.revenus*100) : null;
  const byCat = {}; c.list.forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+(Number(t.amount)||0); });
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const biggest = rows.find(([id])=>{ const x=catById(id); return !x || x.group!=='epargne'; });
  const overB = sc==='commun' ? planFor(month).categories.filter(x=>x.group==='variable' && x.budget>0 && (c.spent[x.id]||0)>x.budget) : [];

  let h = `<div class="scopebar">${segHtml(true)}</div><div class="dash"><div class="col">`;
  h += `<section class="glass card o1"><div class="cardhead"><h2>${esc(monthLabel(month).split(' ')[0])} at a glance</h2></div>
    <div class="review">
      <div class="stat"><div class="l">Spent</div><div class="v">${E(spent)}</div>${deltaHtml(spent,pspent,false)}</div>
      <div class="stat"><div class="l">Saved</div><div class="v" style="color:var(--save)">${E(saved)}</div>${deltaHtml(saved,psaved,true)}</div>
      <div class="stat"><div class="l">Savings rate</div><div class="v">${rate===null?'–':rate+'%'}</div><div class="d flat">of ${E(c.revenus)} coming in</div></div>
      <div class="stat"><div class="l">Biggest spending</div><div class="v" style="font-size:1.05rem;padding-top:4px">${biggest?esc(catName(biggest[0])):'–'}</div><div class="d flat">${biggest?E(biggest[1]):''}</div></div>
    </div>
    ${overB.length?`<p class="small" style="margin:12px 0 0;color:var(--bad)">Over budget: ${overB.map(x=>esc(x.name)).join(', ')}</p>`:''}
  </section>`;

  const ms = [5,4,3,2,1,0].map(k=>addMonths(month,-k));
  const data = ms.map(m=>{ const k=calc(m, sc); return {m, dep:k.g.fixe.s+k.g.variable.s, ep:k.g.epargne.s}; });
  const maxV = Math.max(1, ...data.map(d=>d.dep+d.ep), c.revenus);
  h += `<section class="glass card o3"><div class="cardhead"><h2>Last 6 months</h2><span class="small muted">tap a month</span></div>
    <div class="months">${c.revenus>0?`<span class="revline" style="bottom:${24 + c.revenus/maxV*120}px"></span>`:''}${data.map(d=>`<button type="button" class="mcol ${d.m===month?'sel':''}" data-m="${d.m}" aria-label="${esc(monthLabel(d.m))}">
      <span class="v">${d.dep+d.ep>0?E(d.dep+d.ep):''}</span>
      <span class="plot"><span class="stack" style="height:${Math.max(3,(d.dep+d.ep)/maxV*100)}%"><b style="flex:${d.dep||0};background:var(--ink);opacity:.7"></b><b style="flex:${d.ep||0};background:var(--save)"></b></span></span>
      <small>${esc(monthLabel(d.m,true))}</small></button>`).join('')}</div>
    <div class="key"><span style="--c:var(--ink)">Spent</span><span style="--c:var(--save)">Saved</span>${c.revenus>0?`<span class="dash-key">Income ${E(c.revenus)}</span>`:''}</div>
  </section>`;
  h += `</div><div class="col">`;
  h += `<section class="glass card o2"><div class="cardhead"><h2>${sc==='tout'?'All expenses':(sc==='commun'?'Shared expenses':esc((c.member&&c.member.name||'')+"'s expenses"))}</h2><span class="small muted">${c.list.length}</span></div>
    <input type="search" id="histSearch" placeholder="Search a category, a note, an amount…" value="${esc(histFilter)}" style="margin-bottom:6px">
    <div id="txList"></div></section>`;
  h += `<section class="glass card o4"><h2 style="margin-bottom:10px">By category</h2>`;
  if(!rows.length) h += `<p class="empty">Nothing this month.</p>`;
  else {
    const total = rows.reduce((a,r)=>a+r[1],0), mx = rows[0][1];
    rows.forEach(([id,v])=>{ const x=catById(id); h += `<div class="cat"><div class="catrow"><span>${esc(catName(id))}</span><span class="amt">${E(v)} <span class="muted">${Math.round(v/total*100)}%</span></span></div><div class="bar"><i class="${x&&x.group==='epargne'?'save':''}" style="width:${v/mx*100}%"></i></div></div>`; });
    h += `<div class="totrow"><span>Total</span><span>${E2(total)}</span></div>`;
  }
  h += `</section></div></div>`;
  $('view').innerHTML = h;
  bindSeg();
  renderTxList(c.list, sc);
  $('histSearch').oninput = e => { histFilter = e.target.value; renderTxList(c.list, sc); };
  document.querySelectorAll('.mcol[data-m]').forEach(b=>b.onclick=()=>{ if(b.dataset.m!==month){ month=b.dataset.m; renderMonthNav(); subscribeMonth(); } });
}
function renderTxList(all, sc){
  const catName = id => (catById(id)||{name:'Deleted category'}).name;
  const f = histFilter.trim().toLowerCase();
  const list = all.filter(t=> !f || catName(t.cat).toLowerCase().includes(f) || String(t.note||'').toLowerCase().includes(f) || String(t.amount).includes(f))
    .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  let h='';
  if(!list.length) h = `<p class="empty">${f?'Nothing matches your search.':'No expenses logged here this month.'}</p>`;
  let lastDay='';
  list.forEach(t=>{
    if(t.date!==lastDay){ lastDay=t.date; const [y,mo,d]=t.date.split('-').map(Number);
      h += `<div class="txday">${esc(new Date(y,mo-1,d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))}</div>`; }
    const who = t.by && names[t.by] ? (t.by===uid ? 'you' : names[t.by]) : '';
    const tsc = scopeOf(t), cn = catName(t.cat), cc = catById(t.cat);
    const tag = sc==='tout' ? `<span class="tag ${themeCls(tsc)}">${esc(scopeLabel(tsc))}</span>` : (cc && cc.group==='epargne' ? '<span class="tag save">savings</span>' : '');
    const sub = [t.note, who?('by '+who):''].filter(Boolean).join(' · ');
    h += `<div class="tx"><${canWrite?'button type="button" class="txmain" data-edit="'+esc(t.id)+'" aria-label="Edit this expense"':'div class="txmain"'}>
      <span class="dot ${themeCls(tsc)}" aria-hidden="true">${esc(initials(cn))}</span>
      <div class="info"><div>${esc(cn)} ${tag}</div><div>${esc(sub)||'&nbsp;'}</div></div>
      <div class="val">${E2(t.amount)}</div>${canWrite?'</button>':'</div>'}${canWrite?`<button class="del" data-id="${esc(t.id)}" aria-label="Delete">×</button>`:''}</div>`;
  });
  $('txList').innerHTML = h;
  document.querySelectorAll('#txList [data-edit]').forEach(b=>b.onclick=()=>{ const t=txs.find(x=>x.id===b.dataset.edit); if(t) openSheet(t); });
  document.querySelectorAll('#txList .del').forEach(b=>b.onclick=async()=>{
    const t = txs.find(x=>x.id===b.dataset.id); if(!t) return;
    b.disabled=true;
    try{
      await backend.delTx(t.id);
      const {id, ...rest} = t;
      toast('Expense deleted','Undo', async()=>{ try{ await backend.addTx(rest); }catch(e){ handleWriteError(e); } });
    }catch(e){ b.disabled=false; handleWriteError(e); }
  });
}

/* ---------- GOALS ---------- */
let allTxCache = null, allTxLoading = false, goalEdit = null;
async function ensureAllTx(){
  if(allTxCache || allTxLoading) return;
  allTxLoading = true;
  try{ allTxCache = await backend.allTx(); }catch(e){ allTxCache = []; }
  allTxLoading = false;
  if(view==='goals') render();
}
function goalProgress(g){
  const src = allTxCache || txs;
  const inGoal = t => t.cat===g.cat && (!g.scope || g.scope==='any' || scopeOf(t)===g.scope);
  const saved = (Number(g.start)||0) + src.filter(inGoal).reduce((a,t)=>a+(Number(t.amount)||0),0);
  const last3 = [1,2,3].map(k=>addMonths(curMonth(),-k));
  const pace = src.filter(t=>inGoal(t) && last3.includes(t.month)).reduce((a,t)=>a+(Number(t.amount)||0),0)/3
            || src.filter(t=>inGoal(t) && t.month===curMonth()).reduce((a,t)=>a+(Number(t.amount)||0),0);
  return {saved, pace};
}
function monthsBetween(a,b){ const [y1,m1]=a.split('-').map(Number), [y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1); }
async function saveGoals(list){
  const s = JSON.parse(JSON.stringify(settings)); s.goals = list;
  try{ await backend.saveSettings(s); }catch(e){ handleWriteError(e); throw e; }
}
function renderGoals(){
  ensureAllTx();
  const goals = settings.goals || [];
  const epCats = settings.categories.filter(c=>c.group==='epargne' && !c.archived);
  let h = `<div class="scopebar"><h2 style="font-size:1.4rem">Goals</h2>${canWrite?`<button class="pillbtn glass" id="newGoal">${IC.plus}New goal</button>`:''}</div>`;
  const form = g => `<section class="glass card" style="margin-bottom:14px"><h2 style="margin-bottom:12px">${g.id&&goals.some(x=>x.id===g.id)?'Edit goal':'New goal'}</h2>
      <div class="field"><label for="gName">Name</label><input id="gName" type="text" value="${esc(g.name||'')}" placeholder="House, Cat fund, Summer trip…"></div>
      <div class="row2">
        <div class="field"><label for="gTarget">Target</label><div class="eur"><input id="gTarget" type="number" min="0" step="1" value="${g.target||''}" placeholder="10000"></div></div>
        <div class="field"><label for="gStart">Already saved</label><div class="eur"><input id="gStart" type="number" min="0" step="1" value="${g.start||''}" placeholder="0"></div></div>
      </div>
      <div class="field"><label for="gCat">Money comes from this savings category</label><select id="gCat">${epCats.map(c=>`<option value="${esc(c.id)}" ${c.id===g.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="row2">
        <div class="field"><label for="gScope">Whose savings</label><select id="gScope">
          <option value="any" ${(!g.scope||g.scope==='any')?'selected':''}>Everyone</option>
          <option value="commun" ${g.scope==='commun'?'selected':''}>Shared</option>
          ${settings.members.map(m=>`<option value="${esc(m.id)}" ${g.scope===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="gDeadline">By (optional)</label><input id="gDeadline" type="month" value="${esc(g.deadline||'')}"></div>
      </div>
      <div class="row2"><button class="btn ghost" id="gCancel">Cancel</button><button class="btn" id="gSave">Save goal</button></div>
      ${goals.some(x=>x.id===g.id)?`<button class="linkbtn" id="gDelete" style="color:var(--bad);margin-top:6px">Delete this goal</button>`:''}
    </section>`;
  if(goalEdit) h += form(goalEdit);
  if(!goals.length && !goalEdit) h += `<section class="glass card"><p class="empty" style="padding:10px">No goals yet. A goal shows how close you are to something you save for: a house, a cat fund, a trip.${epCats.length?'':' First add a savings category in Settings.'}</p></section>`;
  h += `<div class="dash">`;
  goals.forEach(g=>{
    const {saved, pace} = goalProgress(g);
    const pct = g.target>0 ? Math.min(100, Math.round(saved/g.target*100)) : 0;
    const left = Math.max(0, g.target - saved);
    let foot;
    if(left<=0) foot = `<span><b>Goal reached!</b> 🎉</span>`;
    else if(g.deadline){ const n = Math.max(1, monthsBetween(curMonth(), g.deadline)+1); foot = `<span><b>${E(left/n)}</b> a month to reach it by ${esc(monthLabel(g.deadline))}</span>`; }
    else if(pace>0){ const n=Math.ceil(left/pace); foot = `<span>At your pace (${E(pace)}/month): about <b>${n} month${n>1?'s':''}</b></span>`; }
    else foot = `<span>${E(left)} to go</span>`;
    const th = g.scope && g.scope!=='any' ? themeCls(g.scope) : 'theme-green';
    h += `<section class="glass goal ${th}">
      <div class="goalhead"><div><div class="goalname">${esc(g.name||'Goal')}</div><div class="small muted">${esc((catById(g.cat)||{name:'?'}).name)}${g.scope&&g.scope!=='any'?' · '+esc(scopeLabel(g.scope)):''}</div></div>
        <div style="text-align:right"><div class="goalpct">${pct}%</div>${canWrite?`<button class="editbtn" data-goal="${esc(g.id)}">Edit</button>`:''}</div></div>
      <div class="gbar"><i style="width:${pct}%"></i></div>
      <div class="goalfoot"><span><b>${E(saved)}</b> of ${E(g.target)}</span>${foot}</div>
    </section>`;
  });
  h += `</div>`;
  if(!allTxCache) h += `<p class="small muted" style="text-align:center">Counting all your savings…</p>`;
  $('view').innerHTML = h;
  const ng=$('newGoal'); if(ng) ng.onclick=()=>{ goalEdit={id:rid(), name:'', target:0, start:0, cat:(epCats[0]||{}).id, scope:'any', deadline:''}; renderGoals(); $('gName').focus(); };
  document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{ goalEdit=JSON.parse(JSON.stringify(goals.find(x=>x.id===b.dataset.goal))); renderGoals(); window.scrollTo(0,0); });
  if(goalEdit){
    $('gCancel').onclick=()=>{ goalEdit=null; renderGoals(); };
    $('gSave').onclick=async()=>{
      const g = {id:goalEdit.id, name:$('gName').value.trim()||'Goal', target:Number($('gTarget').value)||0, start:Number($('gStart').value)||0, cat:$('gCat').value, scope:$('gScope').value, deadline:$('gDeadline').value||''};
      if(!(g.target>0)){ toast('Enter a target amount.'); return; }
      if(!g.cat){ toast('Add a savings category in Settings first.'); return; }
      const list = goals.filter(x=>x.id!==g.id).concat([g]);
      try{ await saveGoals(list); goalEdit=null; toast('Goal saved'); }catch(e){}
    };
    const gd=$('gDelete'); if(gd) gd.onclick=async()=>{
      if(!armDelete(gd,'Tap again to delete')) return;
      try{ await saveGoals(goals.filter(x=>x.id!==goalEdit.id)); goalEdit=null; toast('Goal deleted'); }catch(e){}
    };
  }
}

/* ---------- SETTINGS ---------- */
function planHtml(d){
  const com = d.members.reduce((a,m)=>a+(Number(m.contribution)||0),0);
  const sum = g => d.categories.filter(c=>c.group===g).reduce((a,c)=>a+(Number(c.budget)||0),0);
  const fx=sum('fixe'), va=sum('variable'), ep=sum('epargne');
  const libre = com-fx-va-ep;
  const pc = v => com>0 ? ` <span class="muted">${Math.round(v/com*100)}%</span>` : '';
  const tot = Math.max(1, com, fx+va+ep);
  let h = `<div class="planbar" role="img" aria-label="Shared account breakdown">
      <i style="width:${fx/tot*100}%;background:var(--ink);opacity:.75"></i><i style="width:${va/tot*100}%;background:var(--ink);opacity:.35"></i><i style="width:${ep/tot*100}%;background:var(--save)"></i>${libre<0?`<i style="width:${-libre/tot*100}%;background:var(--bad)"></i>`:''}
    </div><div class="plan">
    <div><span>Paid into shared</span><span>${E(com)}</span></div>
    <div><span>Fixed costs</span><span>${E(fx)}${pc(fx)}</span></div>
    <div><span>Variable spending</span><span>${E(va)}${pc(va)}</span></div>
    <div><span>Shared savings</span><span>${E(ep)}${pc(ep)}</span></div>
    <div class="tot"><span>Unplanned money left in shared</span><span style="color:${libre<0?'var(--bad)':'var(--accent)'}">${E(libre)}</span></div></div>`;
  if(d.members.length){
    h += `<div class="plan" style="margin-top:14px">${d.members.map(m=>{
      const keep=(Number(m.salary)||0)-(Number(m.contribution)||0);
      const fixed=(m.fixed||[]).reduce((a,f)=>a+(Number(f.amount)||0),0);
      return `<div><span>${esc(m.name||'Person')}'s personal money</span><span style="color:${keep<0?'var(--bad)':'inherit'}">${E(keep)}${fixed?` <span class="muted">· ${E(keep-fixed)} after fixed</span>`:''}</span></div>`;
    }).join('')}</div>`;
  }
  h += `<p class="small muted" style="margin:12px 0 0">A common rule of thumb: about 50% for fixed costs, 30% for variable spending and 20% for savings.</p>`;
  return h;
}
function themeOfDraft(d,k){
  const m=d.members[k]; if(!m) return 'blue';
  if(m.color) return m.color;
  if(/wik/i.test(m.name)) return 'pink';
  if(/max/i.test(m.name)) return 'blue';
  return THEMES[k % THEMES.length];
}

    <div style="display:grid;gap:8px">

    <button class="btn ghost full" id="exportBtn">Export expenses for Excel</button>
    <label class="btn ghost full" style="cursor:pointer;margin:0;color:var(--ink);font-size:1rem">Import a backup<input id="importFile" type="file" accept=".json,application/json" hidden></label>
    <button class="btn ghost full" id="signOut">Sign out</button></div></section>`;
  h += `</div><div class="col">`;
  GROUPS.forEach((G,gi)=>{
    h += `<section class="glass card o${gi+2}"><div class="cardhead"><h2>${G.name}</h2><span class="gtot" data-gt="${G.id}">${E(gsum(G.id))} / month</span></div><p class="small muted" style="margin:-6px 0 14px">${G.hint}. Shared budget per month.</p>`;

    if(canWrite) h += `<button class="linkbtn" data-addcat="${G.id}">+ Add a category</button>`;
    h += `</section>`;
  });
  const arch = d.categories.map((c,k)=>({c,k})).filter(x=>x.c.archived);
  if(arch.length){
    h += `<section class="glass card o6"><h2 style="margin-bottom:6px">Archived categories</h2><p class="small muted" style="margin:0 0 12px">Hidden from choices, old expenses keep their name.</p>
      ${arch.map(({c,k})=>`<div class="setrow" style="grid-template-columns:1fr auto"><span>${esc(c.name)} <span class="muted small">${esc(GROUPS.find(g=>g.id===c.group).name)}</span></span>

  }
  h += `</div></div>`;

  $('view').innerHTML = h;
  const v = $('view');
  const refresh = () => { $('planBox').innerHTML = planHtml(d); v.querySelectorAll('[data-gt]').forEach(el=>el.textContent=E(gsum(el.dataset.gt))+' / month'); };
  v.querySelectorAll('input[data-f],select[data-f]').forEach(inp=>{ const ev = inp.tagName==='SELECT'?'onchange':'oninput'; inp[ev]=()=>{
    const k=+inp.dataset.k, j=+inp.dataset.j, f=inp.dataset.f;
    if(f==='mname') d.members[k].name=inp.value;
    if(f==='msal') d.members[k].salary=Number(inp.value)||0;
    if(f==='mcon') d.members[k].contribution=Number(inp.value)||0;
    if(f==='cname') d.categories[k].name=inp.value;
    if(f==='cbud') d.categories[k].budget=Number(inp.value)||0;
    if(f==='fcat') d.members[k].fixed[j].cat=inp.value;
    if(f==='famt') d.members[k].fixed[j].amount=Number(inp.value)||0;
    refresh();
  }; });
  v.querySelectorAll('button[data-f]').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, j=+b.dataset.j, f=b.dataset.f;
    if(f==='mcolor'){ d.members[k].color=b.dataset.c; renderReglages(); return; }
    if(f==='cunarch'){ d.categories[k].archived=false; toast('Restored. Save settings to confirm.'); renderReglages(); return; }
    if(f==='fadd'){ d.members[k].fixed=(d.members[k].fixed||[]).concat([{cat:fixeCats[0].id, amount:0}]); renderReglages(); return; }
    if(f==='fdel'){ d.members[k].fixed.splice(j,1); renderReglages(); return; }
    if(!armDelete(b, f==='cdel'?'Archive?':'Delete?')) return;
    if(f==='mdel'){ d.members.splice(k,1); toast('Removed. Save settings to confirm.'); }
    if(f==='cdel'){ d.categories[k].archived=true; d.categories[k].budget=0; toast('Archived. Save settings to confirm.'); }
    renderReglages();
  });
  v.querySelectorAll('button[data-addcat]').forEach(b=>b.onclick=()=>{ d.categories.push({id:rid(),name:'New category',group:b.dataset.addcat,budget:0}); renderReglages(); });
  const am=$('addMem'); if(am) am.onclick=()=>{ d.members.push({id:rid(),name:'',salary:0,contribution:0,epGoal:0,fixed:[]}); renderReglages(); };
  $('exportBtn').onclick=exportCsv; $('exportJson').onclick=exportJson;
  $('signOut').onclick=()=>backend.signOut && backend.signOut();
  const im=$('importFile'); im.onchange=()=>importJson(im.files[0]);
  const sv=$('saveSet'); if(sv) sv.onclick=async()=>{
    const clean = {
      members:d.members.map((m,k)=>({id:m.id,name:(m.name||'Person').trim(),salary:Number(m.salary)||0,contribution:Number(m.contribution)||0,epGoal:0,color:m.color||themeOfDraft(d,k),
        fixed:(m.fixed||[]).filter(f=>f.cat && Number(f.amount)>0).map(f=>({cat:f.cat, amount:Number(f.amount)}))})),
      categories:d.categories.map(c=>({id:c.id,name:(c.name||'Category').trim(),group:c.group,budget:Number(c.budget)||0,archived:!!c.archived})),
      goals: settings.goals || [] };
    sv.disabled=true;
    try{ await backend.saveSettings(clean); await backend.savePlan(curMonth(), {members:clean.members, categories:clean.categories}); draftSettings=null; toast('Settings saved'); setView('mois'); }
    catch(e){ sv.disabled=false; handleWriteError(e); }
  };
}

/* ---------- export / import ---------- */
function saveFile(name, data, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function exportCsv(){
  try{
    const all = (await backend.allTx()).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(!all.length){ toast('No expenses to export.'); return; }
    const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    const lines = [['Date','Month','For','Category','Group','Amount','Note'].map(q).join(';')];
    all.forEach(t=>{
      const c = catById(t.cat);
      const grp = c ? (GROUPS.find(g=>g.id===c.group)||{name:''}).name : '';
      lines.push([t.date, t.month, scopeLabel(scopeOf(t)), c?c.name:'Deleted category', grp, String(Number(t.amount)||0).replace('.',','), t.note||''].map(q).join(';'));
    });
    saveFile('pay-and-pray-' + todayStr() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv');
  }catch(e){ toast('Export failed, please try again.'); }
}
async function exportJson(){
  try{
    const txAll = await backend.allTx();
    saveFile('pay-and-pray-backup-'+todayStr()+'.json', JSON.stringify({version:2, exportedAt:todayStr(), settings, plans, txs:txAll}), 'application/json');
  }catch(e){ toast('Backup failed, please try again.'); }
}
let importArmed=false;
async function importJson(file){
  if(!file) return;
  try{
    const b = JSON.parse(await file.text());
    if(!b || !Array.isArray(b.txs)){ toast('This file is not a budget backup.'); return; }
    const existing = await backend.allTx();
    if(existing.length && !importArmed){ importArmed=true; toast('You already have expenses. Pick the file again to add them anyway.'); $('importFile').value=''; return; }
    importArmed=false;
    await backend.importAll(b);
    draftSettings=null; allTxCache=null; render();
    toast('Backup imported: '+b.txs.length+' expenses');
  }catch(e){ toast('Import failed: '+(e.message||'unknown error')); }
}

/* ---------- ADD / EDIT sheet ---------- */
let showAllCats = false;
function topCats(sc){
  const cnt = {};
  txs.filter(t=>scopeOf(t)===sc).forEach(t=>{ cnt[t.cat]=(cnt[t.cat]||0)+1; });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(id=>settings.categories.find(c=>c.id===id)).filter(c=>c && !c.archived).slice(0,6);
}
function renderSheetParts(){
  const opts = ['commun', ...settings.members.map(m=>m.id)];
  $('fScope').innerHTML = opts.map(o=>`<button type="button" class="${themeCls(o)}" data-s="${esc(o)}" aria-pressed="${o===selectedScope}"><span class="av" aria-hidden="true">${o==='commun'?'⌂':esc(initials(scopeLabel(o)))}</span>${esc(scopeLabel(o))}</button>`).join('');
  $('fScope').querySelectorAll('button').forEach(b=>b.onclick=()=>{ selectedScope=b.dataset.s; $('sheetBg').className='sheet-bg open '+themeCls(selectedScope); renderSheetParts(); });
  const freq = topCats(selectedScope);
  if(!freq.length || (selectedCat && !freq.some(c=>c.id===selectedCat))) showAllCats = true;
  const chip = c => `<button type="button" data-c="${esc(c.id)}" aria-pressed="${c.id===selectedCat}">${esc(c.name)}</button>`;
  let h = '';
  if(freq.length) h += `<div class="chipgroup">Frequent</div><div class="chips">${freq.map(chip).join('')}</div>`;
  if(showAllCats){
    GROUPS.slice().sort((a,b)=> a.id==='variable'?-1:b.id==='variable'?1:0).forEach(G=>{
      const cats=settings.categories.filter(c=>c.group===G.id && (!c.archived || c.id===selectedCat) && !freq.some(f=>f.id===c.id)); if(!cats.length) return;
      h += `<div class="chipgroup">${G.id==='epargne'?'Savings':G.name}</div><div class="chips">${cats.map(chip).join('')}</div>`;
    });
  } else h += `<button type="button" class="linkbtn" id="moreCats">All categories ›</button>`;
  $('fCats').innerHTML = h;
  $('fCats').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ selectedCat=b.dataset.c; $('fCats').querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.c===selectedCat))); });
  const mc=$('moreCats'); if(mc) mc.onclick=()=>{ showAllCats=true; renderSheetParts(); };
}
function openSheet(tx){
  if(!settings) return;
  editTx = (tx && tx.id) ? tx : null;
  $('sheetTitle').textContent = editTx ? 'Edit expense' : 'New expense';
  $('fSave').textContent = editTx ? 'Save changes' : 'Add expense';
  selectedCat = editTx ? editTx.cat : null;
  selectedScope = editTx ? scopeOf(editTx) : (scope==='tout' ? 'commun' : scope);
  showAllCats = false;
  $('fAmt').value = editTx ? String(editTx.amount) : '';
  $('fNote').value = editTx ? (editTx.note||'') : '';
  $('fDate').value = editTx ? editTx.date : (month===curMonth() ? todayStr() : (month<curMonth()? month+'-'+pad(daysIn(month)) : month+'-01'));
  renderSheetParts();
  $('sheetBg').className = 'sheet-bg open ' + themeCls(selectedScope);
  $('fAmt').focus();
}
function closeSheet(){ $('sheetBg').classList.remove('open'); editTx=null; }
function closeAfford(){ $('affBg').classList.remove('open'); }
$('fab').onclick=()=>openSheet();
$('fCancel').onclick=closeSheet;
$('affClose').onclick=closeAfford;
$('sheetBg').onclick=e=>{ if(e.target===$('sheetBg')) closeSheet(); };
$('affBg').onclick=e=>{ if(e.target===$('affBg')) closeAfford(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); closeAfford(); } });
$('fSave').onclick=async()=>{
  const amt=parseAmt($('fAmt').value);
  if(!(amt>0)){ toast('Enter an amount.'); $('fAmt').focus(); return; }
  if(!selectedCat){ toast('Pick a category.'); return; }
  const date=$('fDate').value || todayStr();
  const note=$('fNote').value.trim().slice(0,80);
  const btn=$('fSave'); btn.disabled=true;
  try{
    if(editTx){
      const {id, ...rest} = editTx;
      await backend.updTx(id, {...rest, amount:amt, cat:selectedCat, scope:selectedScope, date, month:date.slice(0,7), note, by:rest.by??null, createdAt:rest.createdAt||Date.now(), editedAt:Date.now()});
      closeSheet(); toast('Expense updated');
    } else {
      const newId = await backend.addTx({amount:amt, cat:selectedCat, scope:selectedScope, date, month:date.slice(0,7), note, by:uid||null, createdAt:Date.now()});
      closeSheet();
      const cn=(catById(selectedCat)||{name:''}).name;
      toast(`${E2(amt)} · ${cn}`, newId?'Undo':null, async()=>{ try{ await backend.delTx(newId); }catch(e){ handleWriteError(e); } });
    }
    if(date.slice(0,7)!==month){ month=date.slice(0,7); renderMonthNav(); subscribeMonth(); }
  }catch(e){ handleWriteError(e); }
  btn.disabled=false;
};

/* ---------- nav ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('prevM').onclick=()=>{ month=addMonths(month,-1); renderMonthNav(); subscribeMonth(); };
$('nextM').onclick=()=>{ month=addMonths(month,1); renderMonthNav(); subscribeMonth(); };

init();
</script>
